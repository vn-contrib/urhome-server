scalar Time 

type Query {
  ping: String!
  currentUser: User!
  currentPropertyMember(propertyId: ID!): PropertyMember!
}

type Mutation {
  createProperty(input: PropertyInput!): Property!
}

type User {
  id: Int!
  properties: [PropertyMember!]!
}

type Property {
  id: Int!
  name: String!
  leases: [Lease!]!
}

type PropertyMember {
  propertyId: Int!
  userId: Int!
  role: PropertyMemberRole!
  property: Property!
}

type Lease {
  id: Int!
  startTime: Time!
  endTime: Time
  tenants: [Tenant!]!
}

type Tenant {
  id: Int!
  name: String!
}

enum PropertyMemberRole {
  owner
  manager
  tenant
}

input PropertyInput {
  name: String
}