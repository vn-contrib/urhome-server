type Query {
  ping: String!
  currentUser: User!
  currentPropertyMember(propertyId: ID!): PropertyMember!
}

type Mutation {
  createProperty(input: PropertyInput!): Property!
}

type User {
  id: Int!
  properties: [PropertyMember!]!
}

type Property {
  id: Int!
  name: String!
}

type PropertyMember {
  propertyId: Int!
  userId: Int!
  role: PropertyMemberRole!
  property: Property!
}

enum PropertyMemberRole {
  owner
  manager
  tenant
}

input PropertyInput {
  name: String
}